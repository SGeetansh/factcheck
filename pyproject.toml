[project]
name = "genai-article-rectification-challenge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "litellm==1.103.10",
    "pydantic==2.14.2",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.0.0",
]

[dependency-groups]
dev = [
    "black==25.11.0",
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
